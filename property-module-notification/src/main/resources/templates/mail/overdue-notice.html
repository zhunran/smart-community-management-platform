<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物业费逾期通知</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background-color: #e74c3c;
            color: #ffffff;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .header p {
            margin: 8px 0 0;
            opacity: 0.9;
            font-size: 14px;
        }
        .body {
            padding: 30px;
            color: #333;
        }
        .greeting {
            font-size: 16px;
            margin-bottom: 20px;
        }
        .alert-box {
            background-color: #fff8f8;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .alert-box .label {
            color: #e74c3c;
            font-weight: bold;
            font-size: 14px;
        }
        .alert-box .value {
            font-size: 28px;
            font-weight: bold;
            color: #e74c3c;
            margin-top: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        table th {
            background-color: #f8f9fa;
            text-align: left;
            padding: 10px 12px;
            font-size: 13px;
            color: #666;
            border-bottom: 2px solid #dee2e6;
        }
        table td {
            padding: 10px 12px;
            font-size: 14px;
            border-bottom: 1px solid #eee;
        }
        table tr:last-child td {
            border-bottom: none;
        }
        .amount {
            text-align: right;
            font-weight: bold;
        }
        .amount.overdue {
            color: #e74c3c;
        }
        .footer {
            background-color: #f8f9fa;
            padding: 20px 30px;
            font-size: 12px;
            color: #999;
            text-align: center;
            border-top: 1px solid #eee;
        }
        .footer p {
            margin: 4px 0;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background-color: #e74c3c;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            margin-top: 16px;
        }
        .btn:hover {
            background-color: #c0392b;
        }
        .notice {
            font-size: 13px;
            color: #888;
            margin-top: 20px;
            padding: 12px;
            background-color: #fcfcfc;
            border-radius: 4px;
            border-left: 3px solid #e74c3c;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>物业费逾期提醒</h1>
        <p th:text="${todayStr}">通知日期</p>
    </div>

    <div class="body">
        <div class="greeting">
            尊敬的 <strong th:text="${ownerName}">业主</strong>，您好：
        </div>

        <p style="font-size:14px; line-height:1.8;">
            截至 <strong th:text="${todayStr}">今日</strong>，
            您名下有以下账单已逾期未缴纳，共计 <strong style="color:#e74c3c;" th:text="${overdueCount}">N</strong> 笔，
            逾期总金额 <strong style="color:#e74c3c; font-size:18px;" th:text="${'¥' + #numbers.formatDecimal(totalOverdueAmount, 1, 2)}">¥0.00</strong>。
        </p>

        <div class="alert-box">
            <div class="label">逾期总金额（含罚息）</div>
            <div class="value" th:text="${'¥' + #numbers.formatDecimal(totalOverdueAmount, 1, 2)}">¥0.00</div>
        </div>

        <table>
            <thead>
            <tr>
                <th>账单编号</th>
                <th>账期</th>
                <th>截止日期</th>
                <th>总金额</th>
                <th>逾期金额</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="bill : ${bills}">
                <td th:text="${bill.billNo}">BILL2026-001</td>
                <td th:text="${bill.billPeriod}">2026-06</td>
                <td th:text="${#temporals.format(bill.dueDate, 'yyyy-MM-dd')}" style="color:#e74c3c;">2026-06-15</td>
                <td class="amount" th:text="${'¥' + #numbers.formatDecimal(bill.totalAmount, 1, 2)}">¥100.00</td>
                <td class="amount overdue" th:text="${'¥' + #numbers.formatDecimal(bill.totalAmount - bill.paidAmount, 1, 2)}">¥0.00</td>
            </tr>
            </tbody>
        </table>

        <div class="notice">
            <strong>温馨提示：</strong><br>
            1. 逾期产生罚息将按日累计，请尽快缴纳。<br>
            2. 如有疑问请联系物业管理处或拨打服务热线。<br>
            3. 此邮件由系统自动发送，请勿回复。
        </div>

        <div style="text-align: center;">
            <a class="btn" th:href="${portalUrl ?: '#'}">立即缴费</a>
        </div>
    </div>

    <div class="footer">
        <p><strong th:text="${propertyName ?: '物业管理处'}">物业管理处</strong></p>
        <p th:text="${'联系电话：' + (contactPhone ?: '')}">联系电话：</p>
        <p>本邮件由物业管理收费系统自动发送</p>
    </div>
</div>
</body>
</html>
