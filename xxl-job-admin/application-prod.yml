# ═══════════════════════════════════════════
# XXL-Job 调度中心 配置
# ═══════════════════════════════════════════

server:
  port: 9099
  servlet:
    context-path: /xxl-job-admin

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    username: ${XXL_MYSQL_USER:your_db_user}
    password: ${XXL_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET SESSION transaction_isolation='READ-COMMITTED'

  mvc:
    static-path-pattern: /static/**

logging:
  file:
    path: ${LOG_PATH:./logs}/xxl-job-admin

xxl:
  job:
    accessToken: ${XXL_JOB_ACCESS_TOKEN}
    i18n: zh_CN
    logretentiondays: 30
